name: Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: "3.11"

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Black formatting check
        id: black
        run: |
          black --check sage/ tests/ || echo "::warning::Code formatting issues found. Run 'make format' to fix."
        continue-on-error: true

      - name: Run isort import sorting check
        id: isort
        run: |
          isort --check-only sage/ tests/ || echo "::warning::Import sorting issues found. Run 'make format' to fix."
        continue-on-error: true

      - name: Run Flake8 linting
        id: flake8
        run: |
          flake8 sage/ tests/ --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(code)s: %(text)s'
        continue-on-error: true

      - name: Run mypy type checking
        id: mypy
        run: |
          mypy sage/ --no-error-summary || echo "::warning::Type checking issues found."
        continue-on-error: true

      - name: Run security check with Bandit
        id: bandit
        run: |
          pip install bandit[toml]
          bandit -r sage/ -f json -o bandit-report.json || true
          if [ -f bandit-report.json ]; then
            cat bandit-report.json | jq -r '.results[] | "::warning file=\(.filename),line=\(.line_number)::\(.issue_text)"'
          fi
        continue-on-error: true

      - name: Calculate code complexity
        id: complexity
        run: |
          pip install radon
          radon cc sage/ -a -nb || true
          radon mi sage/ -nb || true
        continue-on-error: true

      - name: Check test coverage
        run: |
          pytest tests/ --cov=sage --cov-report=term --cov-report=xml --cov-fail-under=0

      - name: Generate coverage comment
        if: github.event_name == 'pull_request'
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(f\"{float(root.attrib['line-rate']) * 100:.1f}\")")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

      - name: Comment PR with quality results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = process.env.COVERAGE || 'N/A';
            const body = `## 🔍 Code Quality Report

            ### Coverage
            📊 **${coverage}%** line coverage

            ### Checks
            ${process.env.BLACK_STATUS === 'failure' ? '❌' : '✅'} Code formatting (Black)
            ${process.env.ISORT_STATUS === 'failure' ? '❌' : '✅'} Import sorting (isort)
            ${process.env.FLAKE8_STATUS === 'failure' ? '❌' : '✅'} Linting (Flake8)
            ${process.env.MYPY_STATUS === 'failure' ? '⚠️' : '✅'} Type checking (mypy)

            ---
            *Run \`make check\` locally to verify before pushing*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        env:
          BLACK_STATUS: ${{ steps.black.outcome }}
          ISORT_STATUS: ${{ steps.isort.outcome }}
          FLAKE8_STATUS: ${{ steps.flake8.outcome }}
          MYPY_STATUS: ${{ steps.mypy.outcome }}

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check for vulnerabilities with pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || echo "::warning::Security vulnerabilities found in dependencies"
        continue-on-error: true

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const additions = pr.data.additions;
            const deletions = pr.data.deletions;
            const totalChanges = additions + deletions;

            let size = 'XS';
            let emoji = '🟢';
            if (totalChanges > 1000) {
              size = 'XL';
              emoji = '🔴';
            } else if (totalChanges > 500) {
              size = 'L';
              emoji = '🟡';
            } else if (totalChanges > 250) {
              size = 'M';
              emoji = '🟡';
            } else if (totalChanges > 100) {
              size = 'S';
              emoji = '🟢';
            }

            const comment = `${emoji} **PR Size: ${size}**

            📝 +${additions} / -${deletions} lines

            ${totalChanges > 500 ? '⚠️ This PR is quite large. Consider splitting it into smaller PRs for easier review.' : ''}
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
