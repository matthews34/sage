name: Claude AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **/*.py
            **/*.yml
            **/*.yaml
            **/*.toml
            **/*.json

      - name: Prepare diff for review
        id: prepare-diff
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "## Changed Files" > review-context.md
          echo "" >> review-context.md

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "### $file" >> review-context.md
            echo '```diff' >> review-context.md
            git diff origin/${{ github.base_ref }}...HEAD -- "$file" >> review-context.md
            echo '```' >> review-context.md
            echo "" >> review-context.md
          done

          # Truncate if too large (Claude has token limits)
          if [ $(wc -c < review-context.md) -gt 100000 ]; then
            head -c 100000 review-context.md > review-context-truncated.md
            echo "⚠️ Diff truncated due to size" >> review-context-truncated.md
            mv review-context-truncated.md review-context.md
          fi

      - name: Review code with Claude
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: anthropics/anthropic-sdk-github-actions@v1
        id: claude-review
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-3-5-sonnet-20241022
          max-tokens: 4096
          prompt: |
            You are an expert code reviewer specializing in Python, FastAPI, and AI/ML applications.

            Review the following code changes and provide:
            1. **Code Quality**: Identify potential bugs, edge cases, or improvements
            2. **Best Practices**: Check adherence to Python/FastAPI best practices
            3. **Performance**: Flag any performance concerns, especially for Raspberry Pi deployment
            4. **Security**: Identify security vulnerabilities or concerns
            5. **Testing**: Suggest test cases that should be added
            6. **Documentation**: Note missing or unclear documentation

            Focus on:
            - This is a Raspberry Pi edge deployment (resource constraints matter)
            - FastAPI best practices
            - Async/await patterns
            - Error handling
            - Type hints
            - Security (especially for AI/LLM integrations)

            Format your response as a structured markdown review with sections for each category.
            Be constructive and specific. If the code looks good, say so!

            Here are the changes:

            $(cat review-context.md)
        continue-on-error: true

      - name: Post review comment
        if: steps.changed-files.outputs.any_changed == 'true' && steps.claude-review.outputs.response != ''
        uses: actions/github-script@v7
        with:
          script: |
            const review = `## 🤖 Claude AI Code Review

            ${{ steps.claude-review.outputs.response }}

            ---
            *This review was generated by Claude AI. Please use your judgment and verify suggestions.*
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: review
            });

      - name: Review specific file types
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.split(' ');

            let warnings = [];

            // Check for common issues
            for (const file of changedFiles) {
              if (file.includes('requirements') && !file.includes('requirements-dev')) {
                warnings.push('📦 Dependencies changed - ensure ARM64 compatibility');
              }
              if (file.includes('Dockerfile')) {
                warnings.push('🐳 Dockerfile changed - verify Raspberry Pi optimizations');
              }
              if (file.includes('docker-compose')) {
                warnings.push('🔧 Docker Compose changed - check resource limits');
              }
              if (file.includes('.env')) {
                warnings.push('⚠️ Environment config changed - verify security');
              }
              if (file.includes('models.py')) {
                warnings.push('🗃️ Database models changed - create migration');
              }
            }

            if (warnings.length > 0) {
              const comment = `## ⚠️ Review Checklist

            ${warnings.map(w => `- ${w}`).join('\n')}
            `;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  architecture-review:
    name: Architecture Impact Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyze structural changes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            let architectureChanges = [];

            files.forEach(file => {
              if (file.filename.includes('sage/core/')) {
                architectureChanges.push('🧠 Core business logic modified');
              }
              if (file.filename.includes('sage/db/')) {
                architectureChanges.push('🗄️ Database layer modified');
              }
              if (file.filename.includes('sage/api/')) {
                architectureChanges.push('🌐 API endpoints modified');
              }
              if (file.filename.includes('config.py')) {
                architectureChanges.push('⚙️ Configuration modified');
              }
            });

            if (architectureChanges.length > 0) {
              const uniqueChanges = [...new Set(architectureChanges)];
              const comment = `## 🏗️ Architecture Impact

            This PR modifies core architecture components:

            ${uniqueChanges.map(c => `- ${c}`).join('\n')}

            **Recommended Actions:**
            - Verify backward compatibility
            - Update documentation if needed
            - Consider integration tests
            - Review deployment impact
            `;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
